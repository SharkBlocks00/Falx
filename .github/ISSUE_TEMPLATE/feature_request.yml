name: Feature request
description: Suggest a language feature, standard library addition, or tooling improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Falx! Check [ROADMAP.md](https://github.com/SharkBlocks00/Falx/blob/master/ROADMAP.md) first — it may already be tracked, or flagged as a non-goal.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you're trying to do that Falx doesn't currently support well.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see added — new syntax, a new built-in, a CLI flag, etc. Include example .flx code if it helps illustrate.
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this, and why you're proposing this approach instead.
    validations:
      required: false

  - type: dropdown
    id: roadmap-check
    attributes:
      label: Does this appear in ROADMAP.md already?
      options:
        - "No, this isn't listed there"
        - "Yes, it's listed — I'm requesting it be prioritized sooner"
        - "I haven't checked"
    validations:
      required: true
